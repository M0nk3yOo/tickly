[package]
name = "tickly-api"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
tickly-core = { path = "../../crates/core" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
url = "2"
webauthn-rs = "0.5"
# OpenSSL aus den Quellen bauen: funktioniert auf macOS ohne Homebrew und liefert im Docker-Image ein selbstständiges Binary
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
chrono-tz = "0.10"
sha2 = "0.10"
flate2 = "1"
aes-gcm = "0.10"
hkdf = "0.12"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
totp-rs = { version = "5", features = ["qr", "otpauth"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tickly-agent = { path = "../../crates/agent" }
tickly-platform = { path = "../../crates/platform" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softtoken"] }
