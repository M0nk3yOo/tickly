name: Companion bauen
# Baut die Installer für Windows (.msi/.exe) und macOS (.dmg). Start: Actions → „Companion bauen“ → Run workflow,
# oder durch ein Tag wie companion-v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["companion-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/companion/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: tickly-companion-${{ matrix.os }}
          path: |
            apps/companion/src-tauri/target/**/release/bundle/msi/*.msi
            apps/companion/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/companion/src-tauri/target/**/release/bundle/dmg/*.dmg
