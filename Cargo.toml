[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/agent", "apps/api"]

[workspace.package]
version = "0.9.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# argon2 ist im Dev-Profil sonst sehr langsam
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
