# Tickly – Backend + Weboberfläche + PostgreSQL. TLS und öffentlicher Zugang laufen über einen vorgeschalteten Proxy
# (z. B. Zoraxy, Nginx oder Cloudflare), siehe docs/INSTALLATION.md.
#
#   Starten:             docker compose up -d --build         -> http://localhost:3000
#
# Konfiguration über die Datei .env (Vorlage: .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickly
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in der .env setzen}
      POSTGRES_DB: tickly
    volumes:
      # Datenverzeichnis der Datenbank. Eigenen Pfad per DB_PATH, z. B. ein größeres Laufwerk; ohne Angabe ein Docker-Volume
      - ${DB_PATH:-tickly-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickly -d tickly"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Kein veröffentlichter Port: nur der api-Dienst erreicht die Datenbank.

  api:
    build: .
    restart: unless-stopped
    # Benutzer, als der der Server läuft (uid:gid). Standard: der unprivilegierte Benutzer des Images. Mit RUN_AS gehören
    # Dateien in BACKUP_PATH deinem eigenen Benutzer.
    user: ${RUN_AS:-65532:65532}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tickly:${DB_PASSWORD}@db:5432/tickly
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      TICKLY_TZ: ${TICKLY_TZ:-Europe/Berlin}
      TICKLY_DEMO: ${TICKLY_DEMO:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ORIGIN_SECRET: ${ORIGIN_SECRET:-}
      TICKLY_SECRET: ${TICKLY_SECRET:-}
      BACKUP_DIR: /backups
      COMPANION_LATEST_VERSION: ${COMPANION_LATEST_VERSION:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-365}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Getrenntes Sicherungsverzeichnis. Eigenen Pfad per BACKUP_PATH, z. B. ein anderes Laufwerk (Verzeichnis muss für den Benutzer aus RUN_AS beschreibbar sein)
      - ${BACKUP_PATH:-tickly-backups}:/backups
    # Der Port ist von außen erreichbar (Standard: alle Adressen). Stelle einen Proxy mit HTTPS davor (z. B. Zoraxy,
    # Nginx, Cloudflare) und setze ORIGIN_SECRET, damit nur Anfragen über den Proxy angenommen werden.
    # Nur lokal: TICKLY_BIND=127.0.0.1
    ports:
      - "${TICKLY_BIND:-0.0.0.0}:${TICKLY_PORT:-3000}:3000"

volumes:
  tickly-db:
  tickly-backups:
